<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <div class="sidebar">
            <button id="new-chat-btn" class="icon-btn" title="New Conversation">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                <span>New</span>
            </button>

            <div class="sidebar-divider"></div>

            <div id="conversation-list" class="conversation-list">
                <!-- Conversation buttons injected here -->
            </div>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <header>
                <div class="date-header" id="date-header"></div>
                <h1 class="welcome-text">Welcome.</h1>
                <p class="subtitle">A new day, take good care of yourself ❤️</p>
            </header>

            <div class="chat-container" id="chat-container">
                <!-- Messages -->
            </div>

            <div class="input-area">
                <input type="text" id="chat-input" placeholder="Quick record: thoughts, questions...">
                
                <div class="action-buttons">
                    <label for="pdf-upload" class="icon-btn upload-btn" title="Upload PDF">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
                    </label>
                    <input type="file" id="pdf-upload" accept=".pdf" style="display: none;">
                    
                    <button id="send-btn" class="primary-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
    <script src="/static/script.js"></script>
</body>
</html>
